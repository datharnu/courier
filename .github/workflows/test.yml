name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: handshake, ratchet, relay and the refusals (no chain)
        run: npm run test:ts
      - name: forge test (PrekeyDirectory, MemoPay and DeliveryReceipts)
        run: forge test
      - name: contracts reach ML-DSA only through the precompiles, no ecrecover
        run: npm run cbom:check
